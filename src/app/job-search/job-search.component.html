<div class="job-search">
    <h2 class="job-search__title">Job Search</h2>

    <form class="job-search__form">
        <div class="form-group">
            <label for="jobTitle" class="form-group__label">Job Title</label>
            <input
                    type="text"
                    id="jobTitle"
                    class="form-group__input"
                    placeholder="Enter job title"
                    [(ngModel)]="jobTitle"
                    name="jobTitle"
            />
        </div>

        <div class="form-group">
            <label for="company" class="form-group__label">Company</label>
            <select id="company" class="form-group__select" [(ngModel)]="company" name="company">
                <option value="chewy">Chewy</option>
            </select>
        </div>

        <button type="button" class="job-search__button" (click)="searchJobs()">Search</button>
    </form>

    <div *ngIf="isLoading" class="job-search__loading">
        <div class="loader"></div>
        <p>Searching for jobs...</p>
    </div>

    <div *ngIf="errorMessage" class="job-search__error">
        {{ errorMessage }}
    </div>

    <div *ngIf="searchResults.length > 0" class="job-search__results">
        <h3 class="job-search__results-title">Search Results:</h3>
        <ul class="job-search__results-list">
            <li *ngFor="let result of searchResults" class="job-search__result-item">
                <h4 class="job-search__result-title">{{ result.jobTitle }}</h4>
                <p class="job-search__result-location">{{ result.jobLocation }}</p>
            </li>
        </ul>
    </div>
</div>
